<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Requests a second, eight processes each"><style>text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#57606a}.h{font-weight:600;fill:#24292f}.t{font-size:14px;font-weight:600;fill:#24292f}.v{fill:#24292f}@media (prefers-color-scheme:dark){text{fill:#9da7b3}.h,.t,.v{fill:#e6edf3}}</style><text class="t" x="0" y="16">Requests a second, eight processes each</text><text x="0" y="36">200 connections from 4 load processes on the same 8 cores. Tvine runs tvine start --workers 8 with sessions and rate limits on Redis.</text><text class="h" x="0" y="60">Ping</text><text x="56.8" y="78" text-anchor="end">Tvine</text><rect x="64.8" y="68" width="345.9" height="13" rx="2" fill="#e8590c"/><text class="v" x="415.7" y="78">46,411</text><text x="56.8" y="95" text-anchor="end">Raw Node</text><rect x="64.8" y="85" width="738.9" height="13" rx="2" fill="#868e96"/><text class="v" x="808.7" y="95">99,133</text><text x="56.8" y="112" text-anchor="end">Express</text><rect x="64.8" y="102" width="775.0" height="13" rx="2" fill="#4c6ef5"/><text class="v" x="844.8" y="112">103,974</text><text x="56.8" y="129" text-anchor="end">FastAPI</text><rect x="64.8" y="119" width="303.0" height="13" rx="2" fill="#12b886"/><text class="v" x="372.8" y="129">40,653</text><text x="56.8" y="146" text-anchor="end">Django</text><rect x="64.8" y="136" width="65.7" height="13" rx="2" fill="#ae3ec9"/><text class="v" x="135.5" y="146">8,809</text><text class="h" x="0" y="181">One row</text><text x="56.8" y="199" text-anchor="end">Tvine</text><rect x="64.8" y="189" width="294.4" height="13" rx="2" fill="#e8590c"/><text class="v" x="364.2" y="199">39,497</text><text x="56.8" y="216" text-anchor="end">Raw Node</text><rect x="64.8" y="206" width="665.8" height="13" rx="2" fill="#868e96"/><text class="v" x="735.6" y="216">89,330</text><text x="56.8" y="233" text-anchor="en