<svg xmlns="http://www.w3.org/2000/svg" width="900" height="222" viewBox="0 0 900 222" role="img" aria-label="A real visitor during a 30-second flood: share of requests answered"><style>text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#57606a}.h{font-weight:600;fill:#24292f}.t{font-size:14px;font-weight:600;fill:#24292f}.v{fill:#24292f}@media (prefers-color-scheme:dark){text{fill:#9da7b3}.h,.t,.v{fill:#e6edf3}}</style><text class="t" x="0" y="16">A real visitor during a 30-second flood: share of requests answered</text><text x="0" y="36">The visitor asks five times a second from another IP. Green: Shield on. Red: under half answered.</text><text class="h" x="0" y="60">500 flood connections</text><text x="136" y="78" text-anchor="end">One IP, Shield On</text><rect x="144" y="68" width="715.6" height="13" rx="2" fill="#2f9e44"/><text class="v" x="864.6" y="78">100%</text><text x="136" y="95" text-anchor="end">One IP, Shield Off</text><rect x="144" y="85" width="684.1" height="13" rx="2" fill="#868e96"/><text class="v" x="833.1" y="95">95.6%</text><text x="136" y="112" text-anchor="end">1,000 IPs, Shield On</text><rect x="144" y="102" width="615.4" height="13" rx="2" fill="#2f9e44"/><text class="v" x="764.4" y="112">86%</text><text class="h" x="0" y="147">1000 flood connections</text><text x="136" y="165" text-anchor="end">One IP, Shield On</text><rect x="144" y="155" width="715.6" height="13" rx="2" fill="#2f9e44"/><text class="v" x="864.6" y="165">100%</text><text x="136" y="182" text-anchor="end">One IP, Shield Off</text><rect x="144" y="172" width="14.3" height="13" rx="2" fill="#e03131"/><text class="v" x="163.3" y="182">2%</text><text x="136" y="199" text-anchor="end">1,000 IPs, Shield On</text><rect x="144" y="189" width="1.0" height="13" rx="2" fill="#e03131"/><text class="v" x="149.0" y="199">0%</text></svg>